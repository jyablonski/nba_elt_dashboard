[project]
name = "nba-elt-dashboard"
version = "1.1.7"
description = "NBA Dashboard Project"
authors = [{ name = "jyablonski9", email = "jyablonski9@gmail.com" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [
    "dash>=2.14.0,<3",
    "psycopg2-binary>=2.9.9,<3",
    "sqlalchemy>=2.0.22,<3",
    "pandas>=2.1.1,<3",
    "pyyaml>=6.0.1,<7",
    "dash-bootstrap-components>=1.5.0,<2",
]

[dependency-groups]
test = [
    "pytest>=7.4.2",
    "dash[testing]>=2.14.1",
    "coveralls>=3.3.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "testcontainers>=4.14.2",
    "sqlparse>=0.5.5",
    # MCP server modules must be importable under `uv sync --group test`, and the
    # semantic-layer tests compile real metric queries against a seeded gold schema.
    "mcp>=1.28.1,<2",
    "uvicorn>=0.40.0,<1",
    "metricflow==0.211.0",
]
# Kept out of the default dashboard install so the dashboard image stays lean.
mcp = [
    "mcp>=1.28.1,<2",
    "uvicorn>=0.40.0,<1",
    # `metricflow` rather than `dbt-metricflow`: the latter drags in dbt-core, whose
    # dbt-common/mashumaro stack does not import on Python 3.14. We only need the
    # compile-to-SQL engine and feed it the semantic manifest + our own SQLAlchemy
    # client, so the dbt adapter layer is dead weight anyway. Pinned because
    # MetricFlow's Python API is not a stable contract and the baked manifest's
    # schema version has to stay compatible with it. Upgrade deliberately.
    "metricflow==0.211.0",
]
dev = [
    "ipykernel>=6.25.2",
    "pre-commit>=4.0.0",
    "ruff>=0.14.1",
    "ty>=0.0.35",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ty.src]
# Incremental adoption: dynamic `database` globals and Dash stubs are noisy elsewhere.
include = ["src/theme", "src/ui"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]
markers = [
    "wip: work in progress",
    "infrastructure: mocks for dummy data (sql db, http endpoint etc)",
    "integration: needs Docker + Postgres (Testcontainers)",
    "e2e: browser tests; run with RUN_E2E=1 (see tests/e2e/README.md)",
]
addopts = "-v"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/pages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
