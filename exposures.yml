version: 2

# dbt exposures for the nba_elt_dashboard Plotly Dash app.
#
# Source: github.com/jyablonski/nba_elt_dashboard
# Hosted: https://nbadashboard.jyablonski.dev
#
# The app reads gold-layer mart tables from the Postgres `gold` schema into an
# in-memory snapshot (src/data_access/cache.py) and renders them per page via
# get_table(). Each exposure below maps to one dashboard page and lists the
# gold models that page consumes. Model names match the table names exactly;
# adjust the ref() names if they differ in your dbt project.
#
# NOTE: the following tables are loaded by the dashboard cache but are not read
# by any page or route, so they intentionally have no exposure (candidates for
# removal from source_tables): injury_tracker, opp_stats, rolling_avg_stats,
# team_record_daily_rollup, twitter_comments.

exposures:
  - name: dashboard_overview
    label: League Overview
    type: dashboard
    maturity: high
    url: https://nbadashboard.jyablonski.dev
    description: >
      League Overview page (src/pages/overview.py): standings, team ratings,
      player contract value vs performance, team contract efficiency, and top
      player analysis.
    depends_on:
      - ref('standings')
      - ref('team_ratings')
      - ref('player_stats')
      - ref('contract_value_analysis')
      - ref('team_contracts_analysis')
      - ref('bans')
      - ref('injuries')
    owner:
      name: Jacob Yablonski
      email: jyablonski9@gmail.com

  - name: dashboard_recent_games
    label: Recent Games
    type: dashboard
    maturity: high
    url: https://nbadashboard.jyablonski.dev
    description: >
      Recent Games page (src/pages/recent_games.py) and the home server route
      (src/server.py): game cards, play-by-play highlights and biggest-run
      analysis, and player box scores.
    depends_on:
      - ref('pbp')
      - ref('recent_games_teams')
      - ref('recent_games_players')
      - ref('schedule_tonights_games')
    owner:
      name: Jacob Yablonski
      email: jyablonski9@gmail.com

  - name: dashboard_schedule
    label: Schedule & Win Predictions
    type: dashboard
    maturity: high
    url: https://nbadashboard.jyablonski.dev
    description: >
      Schedule page (src/pages/schedule.py): tonight's games, remaining
      strength of schedule, preseason over/under, spread coverage, comeback
      performance, and margin-of-victory distribution.
    depends_on:
      - ref('schedule_tonights_games')
      - ref('schedule_season_remaining')
      - ref('past_schedule_analysis')
      - ref('preseason_odds')
      - ref('team_odds_outcomes')
      - ref('team_blown_leads')
      - ref('game_types')
    owner:
      name: Jacob Yablonski
      email: jyablonski9@gmail.com

  - name: dashboard_team_analysis
    label: Team Analysis
    type: dashboard
    maturity: high
    url: https://nbadashboard.jyablonski.dev
    description: >
      Team Analysis page (src/pages/team_analysis.py): per-team margin of
      victory, advanced stats KPIs, roster/player stats, roster pay-vs-production
      value, injuries, and recent transactions.
    depends_on:
      - ref('mov')
      - ref('team_adv_stats')
      - ref('player_stats')
      - ref('player_salary_value')
      - ref('team_payroll_summary')
      - ref('injuries')
      - ref('transactions')
    owner:
      name: Jacob Yablonski
      email: jyablonski9@gmail.com

  - name: dashboard_social_media_analysis
    label: Social Media Analysis
    type: dashboard
    maturity: high
    url: https://nbadashboard.jyablonski.dev
    description: >
      Social Media page (src/pages/social_media_analysis.py): Reddit comment
      volume, trending keywords, sentiment time series, and user-flair
      aggregates.
    depends_on:
      - ref('reddit_comments')
      - ref('reddit_recent_keywords')
      - ref('reddit_sentiment_time_series')
      - ref('social_media_aggs')
    owner:
      name: Jacob Yablonski
      email: jyablonski9@gmail.com

  - name: dashboard_app_shell
    label: Dashboard App Shell
    type: application
    maturity: high
    url: https://nbadashboard.jyablonski.dev
    description: >
      App-wide navigation shell (src/shell.py): feature flags gate which pages
      and features are exposed across the dashboard.
    depends_on:
      - ref('feature_flags')
    owner:
      name: Jacob Yablonski
      email: jyablonski9@gmail.com
