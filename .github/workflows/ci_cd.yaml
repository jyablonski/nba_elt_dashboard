name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Setup Environment
        run: uv sync --group test

      - name: Run Test Suite
        run: make test

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      UV_VERSION: "0.11.14"
      PYTHON_VERSION: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: ty
        run: uv run ty check --output-format github

  deploy:
    name: Deploy Pipeline
    needs: [test, quality]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: Run deployment script on GCP VM
        run: bash .github/scripts/vm_deploy.sh
        env:
          GCP_VM_IP: ${{ secrets.GCP_VM_IP }}
          GIT_COMMIT: ${{ github.sha }}

  notify:
    name: Slack Notification
    needs: [test, quality, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: jyablonski/actions/deploy-notification@v1
        with:
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          template: ${{ contains(needs.*.result, 'failure') && 'pipeline-failure' || 'deployment-success' }}
